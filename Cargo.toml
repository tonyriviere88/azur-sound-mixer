[package]
name = "azur-audio-switcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Switch audio devices and set per-application volume, from a widget you summon with a keystroke"
publish = false

[build-dependencies]
# The `.ico` that Explorer and a pinned shortcut show has to be in the
# executable's PE resources, which means the linker, which means a build script.
# `build.rs` assembles the file from `assets/app-*.png` and hands it to this.
winresource = "0.1"
# Decoding those same PNGs into the raw pixels `src/mark.rs` carries for the tray
# and the window icon. A build dependency and deliberately only that: doing it here
# is what keeps a PNG decoder out of the shipped binary -- see `mark`.
png = "0.18"

[dependencies]
# The Azur design system as an egui theme. Its egui and ours have to be the same
# version -- two eguis in one graph are two different `Context` types, and the
# theme would style neither. `cargo tree -d -p egui` is the check.
azur-egui-theme = { path = "../azur-egui-theme" }
egui = { version = "0.35", default-features = false }
eframe = { version = "0.35", default-features = false, features = [
    # **`wgpu_no_default_features`, and never `wgpu`.** Both give this program the wgpu
    # painter; the difference is 1,096,192 measured bytes, and it is not optional care.
    #
    # wgpu, not glow, and the reason is not performance. glow presents through OpenGL,
    # and the compositor hands an OpenGL window to the screen through a vertical
    # resample: a one-pixel line loses a quarter of its contrast and the faintest ones
    # vanish. This panel is drawn in one-pixel strokes, so it cannot afford that.
    # `azur_egui_theme::render` has the measurement and picks the backend — Vulkan on
    # Windows, and nothing behind it.
    #
    # That pinning is what `wgpu` throws away. eframe defines the feature as
    # `["wgpu_no_default_features", "egui-wgpu/default"]`, and `egui-wgpu/default`
    # contains `wgpu/default` — *every backend wgpu has*. So taking the obvious-looking
    # name compiles D3D12, GLES and WebGL in alongside Vulkan, together with naga's
    # HLSL and GLSL writers to feed them, for backends `render::backends` will never
    # name. `wgpu_no_default_features` is `["dep:wgpu", "dep:egui-wgpu", "dep:pollster"]`
    # and nothing else, so the feature set that reaches wgpu is the one the theme pins.
    #
    # Nothing in a dependency can enforce this — `azur-egui-theme` sets
    # `default-features = false` on its own `egui-wgpu` entry and eframe re-enables the
    # default anyway, one hop further out. It has to be written here, and it has to stay
    # written here. `cargo tree -e features -i wgpu` is the check: no line reading
    # `wgpu feature "dx12"` or `"gles"`.
    #
    # The two halves of `egui-wgpu/default` that are *not* backends
    # (`fragile-send-sync-non-atomic-wasm`, `macos-window-resize-jitter-fix`) are both
    # wanted, and both arrive from `azur-egui-theme`'s pin instead.
    "wgpu_no_default_features",
] }

[dev-dependencies]
# Tests only, and for one job: decoding `assets/app-*.png`, so `mark.rs` can assert
# that the pixels the binary carries are the art in the tree rather than whatever
# `build.rs` last happened to write. Nothing in the shipped binary decodes a PNG --
# see `mark`.
png = "0.18"

[target.'cfg(windows)'.dependencies]
# Named directly, not just through `windows`, because `#[interface]` expands to
# `windows_core::` paths — which is how `audio::policy` declares the undocumented
# interface that sets a default device. Same version as the one `windows` pulls in,
# so Cargo unifies them rather than putting two COM runtimes in the graph.
windows-core = "0.62"
# To get at the `HWND` behind eframe's window, which is the only way to tell DWM to
# stop drawing an outline of its own over the one the theme paints. eframe depends on
# this same version but does not re-export it.
raw-window-handle = "0.6"
# Core Audio (MMDevice + WASAPI session control) is the whole of the backend.
# Endpoints carries IAudioEndpointVolume and IAudioMeterInformation; Shell and
# Gdi are for reading an application's own icon out of its executable.
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    # `AttachConsole`, for the output of `--help` and of a usage error. This binary is a
    # `windows` subsystem binary in every profile, so it has no standard handles of its own
    # and borrows the shell's — see `system::attach_parent_console`.
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    # RegisterHotKey, for the keystroke that summons the widget.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# The profile behind `cargo claude-*` — see the aliases in `.cargo/config.toml`.
#
# `dev` and nothing else, on purpose: what an assistant builds has to be what the developer
# builds, or a green agent run says nothing about the repository. All this buys is the
# *directory* — cargo puts a custom profile's artifacts in `target/<name>`, so two builders
# stop invalidating and locking one shared `target/debug`.
#
# Not `strip`ped, not `opt-level`ed, no `debug = 0`: every one of those would be a second set
# of compiler flags to hold in mind when a test passes here and fails there.
[profile.claude]
inherits = "dev"

[profile.release]
# A tray-resident widget; size and startup matter more than the last few percent
# of throughput in code that spends its life waiting on a 60Hz vsync.
#
# **`"s"` and not `"z"`, and that is measured rather than cautious.** `"z"` for the whole
# graph came out 6,208,000 bytes against `"s"`'s 5,844,480 — **363,520 bytes bigger**, for
# the slower code. `"z"` is `"s"` plus "do not unroll and do not vectorise", and under
# `lto = "fat"` that also withholds the inlining the link-time pass needs to see a call is
# dead and drop it; on a graph that is mostly egui and wgpu generics, what it saves in
# loop bodies it loses several times over in code that no longer gets eliminated. So the
# whole-graph knob is settled in the direction that happens to be both smaller and faster,
# and `"z"` survives only where it was measured to help — see the per-package blocks at
# the bottom of this file. Do not "tighten" this to `"z"` without re-linking both.
opt-level = "s"
# `fat` rather than `thin`, and `codegen-units = 1` with it: one module for the whole
# graph, so a generic instantiated in twenty crates is emitted once. Costs release
# build time and nothing else — `dev`, the profile anybody actually waits on, is
# untouched.
lto = "fat"
codegen-units = 1
strip = true
# The largest single lever in this binary by a wide margin, and it is available because
# **nothing in this process recovers from a panic.** Telling rustc that nothing unwinds
# deletes every cleanup landing pad, shrinks `.pdata` to one entry per remaining
# function, and — because `nounwind` everywhere unlocks inlining — cascades through the
# whole generic surface of egui and wgpu.
#
# The check before taking it was `catch_unwind`, and it comes out clean in a way worth
# writing down rather than re-deriving:
#
# - Nothing in `src/`, and nothing in eframe, egui, epaint, winit, wgpu, wgpu-core or
#   naga. The six sites in `wgpu-hal` are all `let _ = catch_unwind(|| log!(..))` inside
#   FFI debug callbacks — the result is discarded, so no state is recovered, and the
#   callbacks are only registered when validation layers are on, which in a release
#   build they are not.
# - The two threads this program runs — `audio` and `resident` — have no recovery path
#   to lose. A panic in the audio thread already left the widget with a stale snapshot
#   and a channel nobody reads; a panic in the resident thread already left a dead
#   hotkey and a ghost tray icon. Aborting turns two silent half-deaths into a crash,
#   which for a resident widget is the more honest of the two.
# - `resident::wndproc` is an `extern "system" fn` called by the OS, and a panic
#   crossing that boundary aborts today regardless of this setting.
#
# What it costs: no dialog and no log line on the way out, and the tray icon is left for
# the shell to reap. Reconsider only if a worker is ever added whose death the widget is
# expected to survive — a decoder for third-party audio metadata, say. That would need
# to be a separate process rather than a `catch_unwind`, because this measured 1,652,224
# bytes — 22% of the binary it was taken from, and the largest single number in the audit.
panic = "abort"

# `opt-level = "z"` for the crates speed cannot reach, which is a different question
# from "which crates are big". The test each one below passes is that its work happens
# **once, or never**, so trading its throughput for its size trades away nothing this
# program can feel. What is deliberately *not* here is the frame path: `vello_cpu`,
# `harfrust`, `skrifa` and `read_fonts` rasterise and shape, `wgpu-core` looks like a
# one-shot validation layer but encodes a command buffer every frame, and `wgpu-hal`
# and `ash` are the frame.
#
# Translates the WGSL of egui's painter into SPIR-V, once, during pipeline creation.
# The largest crate in the graph after the fix above, and the clearest case here: it is a
# compiler that compiles two shaders per launch.
#
# It is also the one entry in this list whose work happens *at startup*, while the window
# is still hidden — so it is the one whose risk had to be measured rather than reasoned
# about. Launch to a visible panel, five runs each, discarding a cold first run:
#
# | naga | binary | median |
# | --- | ---: | ---: |
# | `opt-level = "s"` | 6,017,536 | 122 ms |
# | **`opt-level = "z"`** | **5,844,480** | **92 ms** |
#
# 173,056 bytes cheaper and not a millisecond slower to open — the smaller image pages in
# faster than the tighter code translates two shaders. If a future egui ships a materially
# larger shader set, re-run that A/B rather than assuming this still holds.
[profile.release.package.naga]
opt-level = "z"

# naga's diagnostics. Formats a shader compilation error, which is to say it runs on
# the launch where the window does not open at all.
[profile.release.package.codespan-reporting]
opt-level = "z"

# The clipboard, and the image codecs behind it. `arboard` arrives through
# `egui-winit`'s `clipboard` feature, which eframe hardcodes in its dependency
# declaration rather than putting behind a feature — so this graph contains a PNG, BMP
# and TIFF decoder that no code in this program can reach, and cannot be told not to.
# `"z"` is the whole of the available answer: they cost what they cost, but they can at
# least cost less. (`png` here is *not* the build-dependency that renders the icon —
# that one runs on the build machine and never ships. See `mark`.)
[profile.release.package.arboard]
opt-level = "z"
[profile.release.package.image]
opt-level = "z"
[profile.release.package.png]
opt-level = "z"
[profile.release.package.miniz_oxide]
opt-level = "z"
[profile.release.package.fdeflate]
opt-level = "z"
[profile.release.package.crc32fast]
opt-level = "z"

# URL parsing and Unicode domain-name normalisation, reached only from `webbrowser`,
# which is reached only from egui-winit's `links` feature — hardcoded by eframe in the
# same way as the clipboard. **This program opens no links.** Every byte here is on a
# path with no caller, so there is no throughput to protect.
[profile.release.package.url]
opt-level = "z"
[profile.release.package.idna]
opt-level = "z"
[profile.release.package.idna_adapter]
opt-level = "z"
[profile.release.package.icu_normalizer]
opt-level = "z"
[profile.release.package.icu_properties]
opt-level = "z"
[profile.release.package.icu_collections]
opt-level = "z"
[profile.release.package.icu_provider]
opt-level = "z"
[profile.release.package.icu_locale_core]
opt-level = "z"
