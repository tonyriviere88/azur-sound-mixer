name: Release

# Push a tag such as `v1.0.0` and this builds the release executable and attaches it to the
# GitHub release of that name, creating the release if it does not exist yet.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest

    # `azur-egui-theme` is a path dependency on `../azur-egui-theme`, so the two repositories
    # are checked out side by side, the way they sit on a developer's disk. The theme is
    # whatever its default branch holds at the time of the build — a path dependency pins no
    # commit, so the lock file cannot.
    defaults:
      run:
        working-directory: azur-sound-mixer

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}
        path: azur-sound-mixer

    - uses: actions/checkout@v4
      with:
        repository: tonyriviere88/azur-egui-theme
        path: azur-egui-theme

    - name: Build
      run: cargo build --release --locked

    - name: Publish
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        cd target/release
        sha256sum azur-audio-switcher.exe > azur-audio-switcher.exe.sha256
        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release upload "$TAG" azur-audio-switcher.exe azur-audio-switcher.exe.sha256 --clobber
        else
          gh release create "$TAG" azur-audio-switcher.exe azur-audio-switcher.exe.sha256 --title "Azur Audio Switcher ${TAG#v}" --generate-notes
        fi
